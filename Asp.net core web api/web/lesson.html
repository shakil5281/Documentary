<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">Loading... | ASP.NET Core .NET 10 Docs</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- highlight.js theme (swapped by JS on dark mode) -->
  <link id="hljsTheme" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    /* ── Reader Layout ─────────────────────────────── */
    .reader-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 56px);
      margin-top: 56px;
    }
    /* ── Sidebar ────────────────────────────────────── */
    .reader-sidebar {
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 1.25rem 0;
      scrollbar-width: thin;
      z-index: 10;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem 1.25rem .75rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: .5rem;
    }
    .sidebar-back {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: .8rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: .3rem .65rem;
      border-radius: 6px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      transition: background .2s;
    }
    .sidebar-back:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    .toc-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: .75rem 1.25rem .35rem;
      margin: 0;
    }
    .toc-nav { padding: 0 .5rem .5rem; }
    .toc-item {
      display: block;
      font-size: .82rem;
      line-height: 1.4;
      color: var(--text);
      text-decoration: none;
      padding: .28rem .75rem;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .15s, color .15s;
    }
    .toc-item:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
    .toc-item.active { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); font-weight: 600; }
    .toc-h1 { font-weight: 700; }
    .toc-h2 { padding-left: 1.5rem; }
    .toc-h3 { padding-left: 2.5rem; font-size: .78rem; color: var(--muted); }
    .toc-divider { border: none; border-top: 1px solid var(--border); margin: .5rem 1.25rem; }
    .section-nav { padding: 0 .5rem 1rem; }
    .section-nav-item {
      display: block;
      font-size: .82rem;
      color: var(--text);
      text-decoration: none;
      padding: .3rem .75rem;
      border-radius: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .15s, color .15s;
    }
    .section-nav-item:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
    .section-nav-item.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      pointer-events: none;
    }
    /* ── Reader Main ─────────────────────────────────── */
    .reader-main {
      min-width: 0;
      padding: 2rem 2.5rem 4rem;
      max-width: 900px;
    }
    .reader-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      gap: 1rem;
      color: var(--muted);
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-error { text-align: center; padding: 3rem; }
    .load-error h2 { color: #e53e3e; margin-bottom: .5rem; }
    /* ── Markdown Prose ──────────────────────────────── */
    .markdown-content {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text);
    }
    .markdown-content h1 {
      font-size: 2rem;
      font-weight: 800;
      border-bottom: 3px solid var(--accent);
      padding-bottom: .5rem;
      margin: 0 0 1.5rem;
      color: var(--heading, var(--text));
    }
    .markdown-content h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 2.5rem 0 .75rem;
      color: var(--heading, var(--text));
      padding-bottom: .3rem;
      border-bottom: 1px solid var(--border);
    }
    .markdown-content h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 1.75rem 0 .5rem;
      color: var(--accent);
    }
    .markdown-content h4 { font-size: 1rem; font-weight: 700; margin: 1.25rem 0 .35rem; }
    .markdown-content p { margin: 0 0 1rem; }
    .markdown-content ul, .markdown-content ol { margin: 0 0 1rem 1.5rem; }
    .markdown-content li { margin-bottom: .35rem; }
    .markdown-content blockquote {
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
      margin: 1rem 0;
      padding: .75rem 1.25rem;
      border-radius: 0 8px 8px 0;
      color: var(--text);
    }
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: .9rem;
      border-radius: 8px;
      overflow: hidden;
    }
    .markdown-content th {
      background: var(--accent);
      color: #fff;
      padding: .6rem .85rem;
      text-align: left;
      font-weight: 600;
    }
    .markdown-content td {
      padding: .55rem .85rem;
      border-bottom: 1px solid var(--border);
    }
    .markdown-content tr:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .markdown-content a { color: var(--accent); }
    .markdown-content a:hover { text-decoration: underline; }
    .markdown-content hr { border: none; border-top: 2px solid var(--border); margin: 2rem 0; }
    .markdown-content strong { font-weight: 700; }
    .markdown-content code:not(.hljs) {
      background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      color: var(--accent);
      padding: .15em .4em;
      border-radius: 4px;
      font-size: .88em;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
    /* ── Code Blocks ─────────────────────────────────── */
    .code-block-wrap {
      position: relative;
      margin: 1.25rem 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .code-block-wrap .lang-tag {
      position: absolute;
      top: 8px;
      left: 14px;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .05em;
      color: #8b949e;
      text-transform: uppercase;
      user-select: none;
    }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      padding: .25rem .65rem;
      font-size: .75rem;
      font-weight: 600;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      transition: background .2s, color .2s;
      z-index: 2;
    }
    .copy-btn:hover { background: rgba(255,255,255,.18); color: #e6edf3; }
    .copy-btn.copied { color: #3fb950; border-color: #3fb950; }
    .code-block {
      margin: 0;
      padding: 2.5rem 1.25rem 1.25rem;
      overflow-x: auto;
      font-size: .875rem;
      line-height: 1.6;
      background: #0d1117;
    }
    .code-block code { background: none; color: inherit; padding: 0; font-size: inherit; }
    /* ── Mermaid Diagrams ─────────────────────────────── */
    .mermaid-wrap {
      margin: 1.5rem 0;
      padding: 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
      overflow-x: auto;
    }
    .mermaid-wrap svg { max-width: 100%; height: auto; }
    .mermaid-error { color: #e53e3e; font-size: .85rem; }
    /* ── Prev / Next ──────────────────────────────────── */
    .prev-next-nav {
      display: flex;
      gap: 1rem;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    .prev-next-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .25rem;
      padding: 1rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      transition: border-color .2s, box-shadow .2s;
    }
    .prev-next-btn:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .prev-next-btn:last-child { text-align: right; }
    .nav-arrow-label { font-size: .75rem; font-weight: 600; color: var(--accent); }
    .nav-lesson-title { font-size: .9rem; font-weight: 600; line-height: 1.3; }
    /* ── Back-to-top ──────────────────────────────────── */
    .top-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
      z-index: 200;
    }
    .top-btn.show { opacity: 1; pointer-events: auto; }
    /* ── Reader Header extras ────────────────────────── */
    .reader-header-center {
      display: flex;
      align-items: center;
      gap: .75rem;
      overflow: hidden;
    }
    #headerBreadcrumb {
      font-size: .8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 340px;
      color: var(--text);
    }
    .reader-header-right {
      display: flex;
      align-items: center;
      gap: .4rem;
      flex-shrink: 0;
    }
    .nav-arrow-btn {
      padding: .35rem .6rem;
      border-radius: 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-size: .9rem;
      transition: background .2s;
    }
    .nav-arrow-btn:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
    .toc-toggle-btn {
      padding: .35rem .75rem;
      border-radius: 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
    }
    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 900px) {
      .reader-layout { grid-template-columns: 1fr; }
      .reader-sidebar {
        position: fixed;
        top: 56px;
        left: 0;
        width: 280px;
        height: calc(100vh - 56px);
        transform: translateX(-100%);
        transition: transform .28s ease;
        box-shadow: 4px 0 20px rgba(0,0,0,.15);
      }
      .reader-sidebar.open { transform: translateX(0); }
      .reader-main { padding: 1.5rem 1rem 3rem; }
      .prev-next-nav { flex-direction: column; }
      #headerBreadcrumb { max-width: 160px; }
    }
    @media (max-width: 560px) {
      .markdown-content h1 { font-size: 1.5rem; }
      .markdown-content h2 { font-size: 1.2rem; }
      .reader-main { padding: 1rem .75rem 3rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><span>API</span> <strong>.NET 10</strong></a>
  <div class="reader-header-center">
    <a href="lessons.html" class="sidebar-back">&#8592; Lessons</a>
    <span id="headerBreadcrumb"></span>
  </div>
  <div class="reader-header-right">
    <button id="prevBtn" class="nav-arrow-btn" type="button" title="Previous lesson">&#8592;</button>
    <button id="nextBtn" class="nav-arrow-btn" type="button" title="Next lesson">&#8594;</button>
    <button id="themeToggle" class="theme-button" type="button">Dark</button>
    <button id="tocToggle" class="toc-toggle-btn" type="button">&#9776; TOC</button>
  </div>
</header>

<div class="reader-layout">

  <!-- Sidebar: TOC + section navigation -->
  <aside class="reader-sidebar" id="readerSidebar">
    <div class="sidebar-header">
      <a href="lessons.html" class="sidebar-back">&#8592; All Lessons</a>
    </div>

    <p class="toc-label">On this page</p>
    <nav id="tocNav" class="toc-nav"></nav>

    <hr class="toc-divider" />
    <p class="toc-label">In this section</p>
    <nav id="sectionNav" class="section-nav"></nav>
  </aside>

  <!-- Main content -->
  <main class="reader-main">
    <div id="loadingState" class="reader-loading">
      <div class="loading-spinner"></div>
      <p>Loading lesson&hellip;</p>
    </div>

    <article id="markdownContent" class="markdown-content" style="display:none"></article>

    <nav id="prevNextNav" class="prev-next-nav" style="display:none">
      <a id="prevLink" class="prev-next-btn" href="#" style="visibility:hidden">
        <span class="nav-arrow-label">&#8592; Previous</span>
        <span class="nav-lesson-title" id="prevTitle"></span>
      </a>
      <a id="nextLink" class="prev-next-btn" href="#" style="visibility:hidden">
        <span class="nav-arrow-label">Next &#8594;</span>
        <span class="nav-lesson-title" id="nextTitle"></span>
      </a>
    </nav>
  </main>

</div>

<button class="top-btn" id="topBtn" type="button" title="Back to top">&#8593;</button>

<!-- Close sidebar overlay on mobile -->
<div id="sidebarOverlay" style="display:none;position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.4)"
     onclick="document.getElementById('readerSidebar').classList.remove('open');this.style.display='none'"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/reader.js"></script>
</body>
</html>
